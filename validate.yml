name: MFG Command Center CI Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Offline Syntax, Security & Unit Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Runtime & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install snowflake-snowpark-python pytest || true

      - name: Validate Container Runtime Deployment Manifest
        run: |
          python scripts/validate_streamlit_deployment.py

      - name: Validate Python AST Syntax
        run: |
          python scripts/validate_python.py

      - name: Run Non-Destructive Deployment & Security Verifier
        run: |
          python scripts/verify_deployment.py

      - name: Run Offline Unit Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"
